<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="絶景予測">
<title>絶景予測</title>
<!-- ホーム画面に置いたとき、これが無いとOSがアプリ名の先頭文字で代用する（「絶」が出ていた）。
     iOS は apple-touch-icon、Android はマニフェストの icons を見る。
     角丸はOS側が付けるので、画像は正方形いっぱいに描いてある。 -->
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=1">
<link rel="manifest" href="manifest.json?v=1">
<meta name="theme-color" content="#0a0f24">
<style>
  /* 配色はカード地に対するコントラストを実測して決めている。
     文字として使う色は 4.5:1 以上（WCAG AA の本文基準）。
     以前はライトモードで 良好 2.60・平凡 2.42・補助文 2.21 と、
     大きな文字の基準 3.0 すら下回っていた。 */
  :root {
    --bg: #f4f4f6; --card: #ffffff; --text: #1c1c1e; --secondary: #6e6e73; --tertiary: #76767c;
    --accent: #ba5d0d; --line: rgba(0,0,0,.08);
    --spectacular: #d83946; --good: #ba5d0d; --fair: #8d721b; --poor: #767676;
    --red: #d0342c; --orange: #d98a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --secondary: #98989f; --tertiary: #838386;
            --line: rgba(255,255,255,.1);
            --accent: #f08529; --spectacular: #de5762; --good: #f08529; --fair: #d4b247;
            --poor: #8c8c8c; --red: #db5b54; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
         background: var(--bg); color: var(--text); font-size: 0.94rem; line-height: 1.5;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  /* 内容はぜんぶ同じ1本の列に置く。幅も中心もそろえる。
     以前は main を 1060px にして中身を 760px 左寄せにしていたため、
     全幅で中央寄せしていた見出しだけが 136px ずれていた。 */
  main { max-width: 560px; margin: 0 auto; padding: 12px 14px 48px; }

  /* PC・タブレット横向き: 左に一覧、右に詳細の2ペイン。
     ただ幅を広げると1行が長くなって読みにくいので、列を分けて使う。 */
  /* [hidden] は display:none を弱い指定で当てるだけなので、display を持つクラスに負ける。
     .place-row の flex に負けて、記録画面で地点カードが消えなかった。 */
  [hidden] { display: none !important; }
  .masthead { display: flex; align-items: baseline; justify-content: space-between;
              gap: 12px; padding: 6px 2px 12px; }
  h1 { font-size: 0.94rem; font-weight: 700; letter-spacing: .18em;
       color: var(--secondary); text-align: left; }
  #recordsLink { color: var(--secondary); font-size: 0.75rem; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .muted { color: var(--secondary); font-size: 0.75rem; }
  .tiny { color: var(--tertiary); font-size: 0.69rem; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .place-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 4px 2px 10px; }
  .place-row .pin { color: var(--accent); font-size: 1.25rem; }
  .place-row .name { font-size: 1.25rem; font-weight: 700; }
  .place-row .chev { margin-left: auto; color: var(--secondary); }

  .ens { display: flex; align-items: flex-end; gap: 2px; height: 44px; margin: 4px 0 2px; }
  .ens-bar { flex: 1; display: flex; align-items: flex-end; height: 100%;
             background: var(--line); border-radius: 2px; overflow: hidden; }
  .ens-bar > div { width: 100%; border-radius: 2px; min-height: 1px; }
  .ens-axis { display: flex; justify-content: space-between; font-size: 0.72rem;
              color: var(--muted); margin-bottom: 4px; }
  /* 小さな操作の当たり判定を広げる。見た目は変えず、押しやすさだけ上げる。
     ☆ は 16×24px しかなく、隣の地点ボタンを誤爆しやすかった。 */
  .tap { position: relative; }
  .tap::after { content: ""; position: absolute; left: 50%; top: 50%;
                transform: translate(-50%, -50%);
                width: max(100%, 44px); height: 44px; }
  /* ☆ は地点名のすぐ右にある。左右対称に広げると名前の末尾を奪うので、
     空いている右側と上下だけへ伸ばす。 */
  #favToggle::after { left: auto; right: -20px; transform: translateY(-50%);
                      width: 40px; }
  .scorebar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .scorebar > div { height: 100%; border-radius: 4px; }

  /* 見たいものを選ぶプルダウン。ネイティブの select を使う。
     iOS ではホイール、Android ではリストと、端末に馴染んだ出方になるし、
     キーボード操作も読み上げも自前で用意しなくて済む。 */
  /* 「もっと詳しく」。決めるのに要らないものは畳んでおく。 */
  .more > summary { list-style: none; cursor: pointer; font-weight: 700; font-size: 0.88rem;
                    display: flex; align-items: center; gap: 6px; min-height: 32px; }
  .more > summary::-webkit-details-marker { display: none; }
  .more > summary::before { content: "▸"; color: var(--secondary); font-size: 0.81rem; }
  .more[open] > summary::before { content: "▾"; }

  /* 光の時間。朝と夕を2列に並べる。 */
  .lt { display: grid; grid-template-columns: auto 1fr 1fr; gap: 4px 12px;
        font-size: 0.81rem; font-variant-numeric: tabular-nums; align-items: baseline; }
  .lt .lt-h { font-size: 0.72rem; color: var(--tertiary); }
  .lt .lt-l { color: var(--secondary); white-space: nowrap; }

  /* まだ答えていない回。アプリを開いて1タップで済むようにする。 */
  .pending { padding: 2px 0 4px; }
  .pending-row { padding: 7px 0; border-top: 1px solid var(--line); }
  .pending-row:first-of-type { border-top: none; }
  .pending-row .outcome { margin-top: 6px; }

  .back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px;
          color: var(--accent); font-size: 0.88rem; padding: 0 2px; margin-bottom: 2px; }

  /* 現象ごとのカード。ひとつの表に全部を詰めると、49個の数字を
     凡例と照らし合わせながら読むことになり、決める道具にならなかった。
     現象ごとに分け、日の良し悪しは【棒の高さ】で示す。
     色や数字を覚えなくても、どの日がいいかがそのまま見える。 */
  .ph-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ph-head .nm { font-weight: 700; font-size: 1rem; }
  .ph-head .ic { font-size: 1.19rem; }
  .ph-out { color: var(--tertiary); font-size: 0.81rem; margin-top: 5px; }

  /* 日を押すと詳しい画面へ。押せることが分かるよう、地の色と枠を付ける。 */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 3px;
         padding: 5px 2px; border-radius: 10px; min-height: 44px;
         background: color-mix(in srgb, var(--text) 6%, transparent);
         border: 1px solid color-mix(in srgb, var(--text) 9%, transparent); }
  .day:active { background: color-mix(in srgb, var(--text) 14%, transparent); }
  @media (hover: hover) { .day:hover { border-color: var(--accent); } }
  .day .v { font-size: 0.72rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  /* 棒の高さが良し悪しを示す。凡例を見に行かなくても、どの日がいいか分かる。 */
  /* 幅の広い画面で棒が横に間延びして「棒」に見えなくなるので上限を置く。 */
  .day .col { width: 58%; max-width: 46px; height: 30px; display: flex; align-items: flex-end; }
  .day .col i { display: block; width: 100%; border-radius: 3px; min-height: 3px; }
  .day .d { font-size: 0.63rem; color: var(--tertiary); line-height: 1.1; text-align: center; }
  /* 次に来る回。どこから見ればいいかの起点を示す。 */
  .day.next { border-color: var(--accent); }
  /* もう終わった回。押せば記録できるので消しはしないが、目は引かせない。
     20時に「今日の夕焼け」がいちばん高い棒として左端に出ていた。 */
  .day.past { opacity: .42; }

  .back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px;
          color: var(--accent); font-size: 0.88rem; padding: 0 2px; margin-bottom: 2px; }

  /* 現象ごとのカード。ひとつの表に全部を詰めると、49個の数字を
     凡例と照らし合わせながら読むことになり、決める道具にならなかった。
     現象ごとに分け、日の良し悪しは【棒の高さ】で示す。
     色や数字を覚えなくても、どの日がいいかがそのまま見える。 */
  .ph-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ph-head .nm { font-weight: 700; font-size: 1rem; }
  .ph-head .ic { font-size: 1.19rem; }
  .ph-out { color: var(--tertiary); font-size: 0.81rem; margin-top: 5px; }

  /* 日を押すと詳しい画面へ。押せることが分かるよう、地の色と枠を付ける。 */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 11px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 4px;
         padding: 7px 2px 6px; border-radius: 10px; min-height: 44px;
         background: color-mix(in srgb, var(--text) 6%, transparent);
         border: 1px solid color-mix(in srgb, var(--text) 9%, transparent); }
  .day:active { background: color-mix(in srgb, var(--text) 14%, transparent); }
  @media (hover: hover) { .day:hover { border-color: var(--accent); } }
  .day .v { font-size: 0.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .day .col { width: 60%; height: 26px; display: flex; align-items: flex-end; }
  .day .col i { display: block; width: 100%; border-radius: 3px; min-height: 2px; }
  .day .d { font-size: 0.63rem; color: var(--tertiary); line-height: 1.12; text-align: center; }
  .day.next { border-color: var(--accent); }

  .highlight { border: 1px solid; }
  /* 数字ではなく評価の言葉を主役にする。
     スコアの実測誤差は ±9.5 点で、84 と 82 の差には意味がない。
     以前は 38.4px の数字に対して「±8点」が 11px と 3.5 倍の差があり、
     いちばん不確かなものがいちばん大きく出ていた。 */
  .head-row { display: flex; align-items: baseline; justify-content: space-between;
              gap: 10px; margin-top: 7px; }
  .verdict-box { display: inline-flex; align-items: baseline; gap: 8px; flex: none;
                 white-space: nowrap; }
  .highlight .verdict { font-size: 1.44rem; font-weight: 800; line-height: 1.1; }
  .highlight .big { font-size: 1rem; font-weight: 700; line-height: 1;
                    font-variant-numeric: tabular-nums; }
  .scorebar .band { position: absolute; top: 0; bottom: 0; opacity: .34; }
  .scorebar.withband { position: relative; }
  .badge { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }

  .factors .f { padding: 6px 0; }
  .factors .fh { display: flex; justify-content: space-between; gap: 8px; font-size: 0.81rem; }
  .factors .mark { display: inline-block; width: 1.2em; font-weight: 700; }
  .factors .bar { position: relative; height: 6px; margin: 3px 0 2px; }
  .factors .bar .mid { position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px; background: var(--line); }
  .factors .bar .fill { position: absolute; top: 0; height: 6px; border-radius: 3px; }
  .pm { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; padding: 2px 0; }
  /* 文字サイズを大きくするとモデル名が折り返してバーと縦がずれる。
     幅は下限として扱い、名前は折り返さない。 */
  .pm .n { min-width: 86px; flex: none; white-space: nowrap; color: var(--secondary); }
  .pm .v { width: 26px; text-align: right; color: var(--secondary); }
  .pm .scorebar { flex: 1; height: 5px; }

  .wk { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 0.81rem; width: 100%; text-align: left; }
  .wk .d { min-width: 62px; flex: none; white-space: nowrap; }
  .wk .t { min-width: 40px; flex: none; white-space: nowrap; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .wk .scorebar { flex: 1; }
  .wk .s { width: 26px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .wk.sel { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 7px; }

  table.numbers { border-collapse: collapse; font-size: 0.75rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.numbers th, table.numbers td { padding: 4px 7px; text-align: right; color: var(--secondary); }
  table.numbers th { font-weight: 500; color: var(--tertiary); }
  table.numbers td:first-child, table.numbers th:first-child { text-align: left; color: var(--text); }
  .scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .outcome { display: flex; gap: 8px; }
  .outcome button { flex: 1; text-align: center; font-size: 0.81rem; font-weight: 500; padding: 9px 0;
                    border-radius: 9px; background: var(--line); }
  .outcome button.on { background: var(--accent); color: #fff; }

  dialog { border: none; border-radius: 16px; background: var(--card); color: var(--text);
           width: min(92vw, 480px); max-height: 82vh; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
  .sheet-body { overflow-y: auto; max-height: calc(82vh - 54px); padding: 0 16px 16px;
                overscroll-behavior: contain; }
  .sheet input[type=search] { width: 100%; font: inherit; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; }
  .chips button { flex: none; font-size: 0.75rem; font-weight: 500; padding: 5px 11px; border-radius: 999px; background: var(--line); }
  .chips button.on { background: var(--accent); color: #fff; }
  .list-item { display: block; width: 100%; text-align: left; padding: 9px 2px; border-top: 1px solid var(--line); }
  /* スポットのカテゴリ見出し。「絶景スポット」の見出しと競わない程度の強さにする。 */
  .spot-cat { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
              margin-top: 14px; padding-bottom: 2px; font-size: 0.81rem; font-weight: 700;
              color: var(--secondary); }
  .spot-cat:first-child { margin-top: 6px; }
  .warn { color: var(--red); font-size: 0.75rem; }
  .notice { color: var(--orange); font-size: 0.75rem; }
  .section-h { display: flex; align-items: baseline; justify-content: space-between;
               gap: 10px; flex-wrap: wrap; margin: 4px 0 6px; }
  .section-h h2 { font-size: 0.94rem; }
  .bins .bin { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; padding: 3px 0; }
  .bins .lb { min-width: 48px; flex: none; white-space: nowrap; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .bins .bar { flex: 1; position: relative; height: 10px; border-radius: 5px; background: var(--line); }
  .bins .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
  .bins .bar .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: color-mix(in srgb, var(--text) 40%, transparent); }
  .bins .pv { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  /* 質の現象は割合ひとつでは表せない。期待外れ／想定どおり／期待以上を積む。 */
  .bins .bar .seg { display: inline-block; height: 100%; vertical-align: top; }
  .bins .bar .seg:first-child { border-radius: 5px 0 0 5px; }
  .bins .bar .seg:last-child { border-radius: 0 5px 5px 0; }
  .bins .bar .seg:only-child { border-radius: 5px; }
  a { color: var(--accent); }

  /* 広い画面。列を1本のまま少しだけ広げる。
     ここは【基本ルールより後ろに置く】。同じ詳細度なら後勝ちなので、
     前に置くと基本ルールに打ち消される（見出しの text-align が実際にそうなっていた）。 */
  @media (min-width: 900px) {
    main { max-width: 680px; }
    /* 680px あれば数値表（約539px）は収まるので横スクロールを出さない */
    .scrollx { overflow-x: visible; }
    table.numbers { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <div class="masthead">
    <h1>絶景予測</h1>
    <button id="recordsLink" class="tap">記録</button>
  </div>
  <button class="place-row card" id="placeButton">
    <span class="pin">📍</span>
    <span>
      <span class="name" id="placeName">…</span>
      <div class="muted" id="placeSub"></div>
    </span>
    <span class="chev">▾</span>
  </button>

  <div class="card" id="nowcast" hidden></div>
  <div id="status" class="card muted" hidden></div>

  <!-- 一覧画面: この地点の全現象を、7日ぶんまとめて見る -->
  <div id="listView">
    <div class="card" id="bestNote" hidden></div>
    <div id="cards"></div>
  </div>

  <!-- 詳細画面: 1つの現象・1つの日を読む。別画面にして、
       スクロールで飛ばすのをやめた（表と詳細が混ざると読みにくい）。 -->
  <div id="detailView" hidden>
    <button class="back" id="backBtn">← 一覧にもどる</button>
    <div id="detailPane"></div>
  </div>

  <!-- 記録画面: 点数が実際とどれだけ合っているかを見る。判断には使わないので別画面。 -->
  <div id="recordsView" hidden>
    <button class="back" id="recordsBack">← 一覧にもどる</button>
    <div class="card">
      <div class="section-h"><h2>記録</h2><span class="muted" id="recCount"></span></div>
      <div id="recEmpty" class="tiny" hidden>まだ記録がありません。
        その回が終わると、ホームと現象の詳細に「実際はどうでしたか？」が出ます。
        押すだけで、そのときの点数と気象の値が端末に残ります。</div>
      <div id="recBody" hidden>
        <div id="calibration"></div>
        <div id="recList"></div>
      </div>
      <p class="tiny" style="margin-top:10px">
        記録は端末に保存されます。
        <button id="exportBtn" class="tap" style="color:var(--accent)">書き出し</button>・<button id="importBtn" class="tap" style="color:var(--accent)">読み込み</button>
        は、別の端末へ移すときや控えを取るときに使います。
        <input type="file" id="importFile" accept=".json" hidden></p>
    </div>
  </div>

  <!-- 終わったのにまだ答えていない回。ホームに出すのはこれだけ。
       点数の較正（帯グラフ・一覧・書き出し）は見に行くものなので #/records へ分けた。 -->
  <div class="card" id="recPending" hidden></div>

  <p class="tiny" id="footer"></p>
</main>

<dialog class="sheet" id="placeSheet">
  <div class="sheet-head"><strong>地点</strong><button id="placeClose">閉じる</button></div>
  <div class="sheet-body">
    <input type="search" id="searchBox" placeholder="住所・地名・駅名（Enterで検索）">
    <div id="searchResults"></div>
    <button class="list-item" id="geoButton">📡 現在地を使う</button>
    <div id="geoStatus" class="warn"></div>
    <div class="section-h" style="margin-top:10px"><h2>お気に入り</h2></div>
    <div id="favList" class="muted">よく使う地点を ☆ で登録するとここに出ます</div>
    <div class="section-h" style="margin-top:10px"><h2>絶景スポット</h2></div>
    <div class="chips" id="spotChips"></div>
    <div id="spotList"></div>
  </div>
</dialog>

<script src="spots.js?v=20260906102948"></script>
<script src="sorami-core.js?v=20260906102948"></script>
<script>
"use strict";
const S = window.Sorami;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const RANK_COLOR = { spectacular: "var(--spectacular)", good: "var(--good)", fair: "var(--fair)", poor: "var(--poor)" };

// 「信頼度中 62–85」だけでは何のことか伝わらない。
// 何が・どれだけ・なぜ不確かなのかを、そのまま言葉にする。
//
// 出どころは2系統。アンサンブル（51通りの計算）が取れていれば
// 「スコアが何点ずれそうか」まで言える。取れなければモデルの割れ方で代用する。
function confidenceText(ev) {
  const u = ev.uncertainty;
  const d = ev.daysAhead || 0;
  const parts = [];

  if (u && u.basis === "ensemble") {
    const e = Math.round(u.expectedError);
    // 「±0点」は精度の主張として強すぎる。1点未満はまとめて「ほぼ動きません」。
    parts.push(e < 1
      ? `${u.ensembleMembers}通りの計算がほぼ一致していて、点数はあまり動きません`
      : `${u.ensembleMembers}通りの計算から、点数は ±${e}点 ほど動く見込みです`);
    // 点数の幅が小さくても評価が割れていることがある（上限に張り付いた分布）。
    // そのときは幅ではなく「何通りが別の評価か」を言う。数字だけ見て
    // 安心されるのを避ける。
    if (ev.confidence.cappedByDisagreement && u.agreement !== null && u.agreement !== undefined) {
      const other = Math.round(u.ensembleMembers * (1 - u.agreement));
      parts.push(`ただし ${other}通りは別の評価です`);
    } else if (ev.confidence.key === "medium") parts.push("評価が1段変わり得ます");
    else if (ev.confidence.key === "low") parts.push("評価はあてになりません");
  } else {
    const lo = Math.round(ev.spread[0]), hi = Math.round(ev.spread[1]);
    const n = Object.keys(ev.perModel).length;
    const spreadWide = hi - lo >= 30;
    if (ev.confidence.key === "high") parts.push(`${n}つの予報モデルがほぼ同じ見立てです（${lo}〜${hi}点）`);
    else if (spreadWide) parts.push(`予報モデルの見立てが ${lo}〜${hi}点 と割れています`);
    else parts.push(`予報モデルは ${lo}〜${hi}点 でおおむね揃っています`);
  }

  // 日数の注意は残す。アンサンブルのばらつきは日数とともに広がるが、
  // 数日先のスコア誤差そのものは検証できていないため、言葉で補う。
  if (d >= 5) parts.push(`${d}日先なので、日が近づいたら見直してください`);
  else if (d >= 2) parts.push(`${d}日先の予測です`);
  return parts.join("。");
}
// 51メンバーの散らばりを見せる。「信頼度 中」と言われるより、
// 51本がどう散らばっているかを見たほうが、利用者は自分で判断できる。
//
// ただしメンバーの【絶対値は本体スコアと比べられない】。メンバー側は
// 太陽方位オフセットも視程も持たず、ECMWF 単独で計算しているため、
// 実データで本体スコアと最大 31 点ずれる。並べて出すと
// 「どっちが本当なの」という答えられない問いを生む。
// そこで本体スコアを中心に重ね直し、【散らばりの形だけ】を見せる。
function renderEnsemble(ev) {
  const u = ev.uncertainty;
  if (!u || u.basis !== "ensemble" || !u.ensembleScores) return "";
  const shift = ev.score - u.ensembleMedian;
  const shifted = u.ensembleScores.map((v) => Math.round(Math.max(0, Math.min(100, v + shift))));
  const hist = Array(10).fill(0);
  for (const v of shifted) hist[Math.min(9, Math.floor(v / 10))]++;
  const peak = Math.max(...hist, 1);
  const sorted = [...shifted].sort((a, b) => a - b);
  const q = (p) => sorted[Math.round((sorted.length - 1) * p)];
  const lo = q(0.1), hi = q(0.9), q1 = q(0.25), q3 = q(0.75);
  const bars = hist.map((c, i) => {
    const mid = i * 10 + 5, inBand = mid >= q1 && mid <= q3;
    return `<div class="ens-bar" title="${i * 10}〜${i * 10 + 9}点: ${c}通り">
      <div style="height:${Math.round(100 * c / peak)}%;background:${inBand ? RANK_COLOR[S.rankOf(mid).key] : "var(--line)"}"></div></div>`;
  }).join("");
  const ranks = [...new Set(shifted.map((v) => S.rankOf(v).label))];
  return `<div class="section-h" style="margin-top:8px"><h2>この点数はどれくらい動きうるか</h2></div>
    <div class="ens">${bars}</div>
    <div class="ens-axis"><span>0</span><span>50</span><span>100</span></div>
    <p class="tiny">ECMWF が初期値をわずかに変えて計算した${u.ensembleMembers}通りの散らばりを、
      この点数（${Math.round(ev.score)}点）を中心に重ねたものです。
      色が付いているのが真ん中の半分（${q1}〜${q3}点）、上下1割を除くと ${lo}〜${hi}点。
      ${ranks.length > 1 ? `評価としては<strong>${ranks.join("・")}</strong>のいずれもあり得ます。` : `評価は<strong>${ranks[0]}</strong>で動きません。`}</p>
    <p class="tiny">点数そのものは8つの予報モデルの中央値です。この${u.ensembleMembers}通りは
      <strong>動きうる幅を測るためだけ</strong>に使っています
      （太陽の方向の空を見ていないので、点数の高さ自体は比べられません）。</p>`;
}
// 「次の見どころ」は 36 時間以内の最高スコアを出すだけなので、
// 全部だめな日でも 29 点の「不向き」がそこに載る（実データで確認）。
// 見どころと呼べない日に見どころと書かない。
const HIGHLIGHT_HEAD = {
  spectacular: "次の見どころ", good: "次の見どころ",
  fair: "いちばん期待できるもの", poor: "めぼしい空はなさそうです",
};
const CONF_ICON = { high: "◎", medium: "△", low: "⚠︎" };

// ---------------------------------------------------------------- 永続化（localStorage）
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode */ } },
};
let place = store.get("sorami.place",
  { id: "default", name: "東京", subtitle: "東京都", latitude: 35.6812, longitude: 139.7671, terrain: null, elevation: null });
let favorites = store.get("sorami.favorites", []);
let sightings = store.get("sorami.sightings", []);

const WIDE = window.matchMedia("(min-width: 900px)");

// 画面は2つ。一覧（全現象×7日）と詳細（1現象・1日）。
// 同じページにスクロールで並べていたが、表と詳細が混ざって読みにくかった。
// 場所は URL のハッシュに持つので、ブラウザの戻るがそのまま効く。
//   #            → 一覧
//   #/sunset     → 夕焼けの直近の回
//   #/sunset/172… → 夕焼けの特定の日
let picked = null;       // 詳細で見ている現象（一覧のときは null）
let atRecords = false;   // 記録画面を見ているか
let nowcastReady = false;  // 実況が取れたか。画面を切り替えても状態を保つ
let pushedCount = 0;     // 自分で進めた回数。戻るボタンの挙動を決めるのに使う
let listScrollY = 0;     // 一覧へ戻ったときに元の位置へ戻す

let bundle = null;       // 取得済みの予報
let weeks = {};          // phenomenon → [{dayMs, evaluation}]
let selectedDay = {};    // phenomenon → dayMs

// ---------------------------------------------------------------- 読み込み
async function load(force) {
  $("status").hidden = false;
  // モデル数は増減する。文言に数字を焼き込むと、増やしたときに嘘になる（4→8で実際にずれていた）。
  $("status").textContent = `${S.MODELS.length}つの気象モデルから取得しています…`;
  $("bestNote").hidden = true;
  try {
    // 光害はその地点の素質なので予報と並行に取得する。取れなくても致命的ではない。
    const [fetched, lp] = await Promise.all([
      // 鉛直分布は雲海を見下ろせる地点でだけ取る。平地では丸ごと不要（+99KB）。
      S.fetchForecast(place.latitude, place.longitude, 8, place),
      S.LightPollution.lookup(place.latitude, place.longitude).catch(() => null),
    ]);
    bundle = fetched;
    place.lightPollution = lp;
    weeks = {};
    for (const id of Object.keys(S.SCORERS)) {
      weeks[id] = S.evaluateWeek(id, bundle, place);
    }
    $("status").hidden = true;
    // 予報が揃ってから URL の場所を反映する。詳細のURLを直接開いた場合も
    // ここで初めてその現象を描ける。
    applyRoute();
    loadNowcast().catch(() => { nowcastReady = false; $("nowcast").hidden = true; });  // 実況は補助。失敗しても予報は出す
  } catch (e) {
    $("status").hidden = false;
    $("status").innerHTML = `<span class="warn">予報を取得できませんでした（${esc(e.message)}）</span> <button id="retry" style="color:var(--accent)">再試行</button>`;
    $("retry").onclick = () => load(true);
  }
}

// アメダス実況。更新は10分間隔なのでそれより短く取りに行かない。
let amedasStations = null;
async function loadNowcast() {
  const latest = await S.Amedas.latestTime();
  if (!amedasStations) amedasStations = await S.Amedas.stations();
  const obs = await S.Amedas.nearest(place.latitude, place.longitude, amedasStations, latest,
    place.elevation ?? bundle?.home.grid.elevation);
  const daytime = S.Sun.position(obs.observedAt, place.latitude, place.longitude).elevation > 0;
  const parts = [S.Amedas.condition(obs, daytime)];
  // 降っているなら量も出す。予報と実況を突き合わせて「ずれています」と警告していたが、
  // 8モデルの中央値は点数のための道具で、いまの気温を当てる道具ではない。
  // 現在時刻ですでにモデル間が7℃割れることがあり（東京で 26.1〜33.0℃）、
  // その差を異常として出していた。比べる相手が違う。測った値をそのまま出す。
  const rain = obs.precipitation1h ?? obs.precipitation10m;
  if (rain !== null && rain > 0) parts.push(`${rain.toFixed(1)}mm`);
  const estimated = S.Amedas.estimatedTemperature(obs);   // 標高差があれば補正した値を出す
  if (estimated) parts.push(`約${estimated.value.toFixed(1)}℃`);
  else if (obs.temperature !== null) parts.push(`${obs.temperature.toFixed(1)}℃`);
  if (obs.humidity !== null) parts.push(`湿度${Math.round(obs.humidity)}%`);
  let html = `<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">
    <span class="muted">実況 ${S.JstCal.hhmm(obs.observedAt)}</span>
    <strong>${esc(parts.join(" "))}</strong>
    <span class="tiny" style="margin-left:auto">${esc(obs.station.name)} ${Math.round(obs.distanceKm)}km</span></div>`;
  const elevationNote = S.Amedas.elevationNote(obs);
  if (elevationNote) html += `<div class="tiny">${esc(elevationNote)}</div>`;
  for (const line of S.Amedas.supplementSummary(obs)) html += `<div class="tiny">${esc(line)}</div>`;
  $("nowcast").innerHTML = html;
  nowcastReady = true;
  $("nowcast").hidden = atRecords;
}

// ---------------------------------------------------------------- 描画
function upcoming(entries, now) {
  return entries.find((e) => !e.evaluation.unavailable && e.evaluation.window[1] > now)
      || entries.find((e) => !e.evaluation.unavailable) || entries[0];
}

function render() {
  const now = Date.now();
  $("placeName").textContent = place.name;
  const subParts = [];
  if (place.subtitle) subParts.push(place.subtitle);
  const elev = place.elevation ?? bundle?.home.grid.elevation;
  if (elev !== null && elev !== undefined) subParts.push(`標高 ${Math.round(elev)}m`);
  // 時刻はすべて【その地点の現地時間】。端末の時差と違うときは、そう書かないと
  // 「今日 18:44」を自分の時計の時刻だと読んでしまう。
  if (bundle && bundle.utcOffsetSeconds !== null && bundle.utcOffsetSeconds !== undefined) {
    const deviceOffset = -new Date().getTimezoneOffset() * 60;
    const diffHours = (bundle.utcOffsetSeconds - deviceOffset) / 3600;
    if (Math.abs(diffHours) >= 0.5) {
      const h = Math.abs(diffHours) % 1 === 0 ? Math.abs(diffHours) : Math.abs(diffHours).toFixed(1);
      subParts.push(`時刻は現地時間（お使いの端末より${h}時間${diffHours > 0 ? "先" : "前"}）`);
    }
  }
  $("placeSub").textContent = subParts.join(" ・ ");

  // 次の見どころ: 36時間以内・評価済み・未来の回のうち最高スコア
  let best = null;
  for (const [id, entries] of Object.entries(weeks)) {
    const u = upcoming(entries, now);
    if (!u || u.evaluation.unavailable) continue;
    if (u.evaluation.window[1] <= now || u.evaluation.peak > now + 36 * 3600000) continue;
    if (!best || u.evaluation.score > best.u.evaluation.score) best = { id, u };
  }
  // 並び: 見られる見込みのあるものが先 → あとは PHENOMENA.order（似たものが隣）。
  //
  // 以前は「直近に起きる順」で並べていたが、7日ぶんを一度に見る表では
  // どの行も同じ7日を持つので「直近」に意味がない。しかも日をまたぐたびに
  // 行が入れ替わり、いつも同じ場所を見れば済むという利点を失っていた。
  // 固定順にして、行の位置が動かないようにする。
  //
  // 対象外（標高が足りない・氷点下にならない等）だけ最後へ回す。
  // その行はセルが無く1本のメッセージになるので、間に挟まると表が分断される。
  const order = Object.keys(weeks).sort((a, b) => {
    const ua = upcoming(weeks[a], now), ub = upcoming(weeks[b], now);
    const aOk = ua && !ua.evaluation.unavailable, bOk = ub && !ub.evaluation.unavailable;
    if (aOk !== bOk) return aOk ? -1 : 1;
    return S.PHENOMENA[a].order - S.PHENOMENA[b].order;
  });
  // 選択中の現象。未選択なら見どころ、それも無ければ評価できる最初のもの。
  const evaluable = order.filter((id) => {
    const u = upcoming(weeks[id], now);
    return u && !u.evaluation.unavailable;
  });
  const inDetail = !!(picked && weeks[picked]);
  const inRecords = atRecords && !inDetail;
  $("listView").hidden = inDetail || inRecords;
  $("detailView").hidden = !inDetail;
  $("recordsView").hidden = !inRecords;
  // 地点と実況は判断のための情報。記録を読んでいるときは要らない。
  $("placeButton").hidden = inRecords;
  $("nowcast").hidden = inRecords || !nowcastReady;
  $("recordsLink").hidden = inDetail || inRecords;

  if (inDetail) {
    $("detailPane").innerHTML = renderDetailPane(picked, now);
    $("backBtn").onclick = goList;
    // 週間の行で日を替える。詳細だけを見ている画面なので、表は出ていない。
    for (const el of $("detailPane").querySelectorAll("[data-day]")) {
      el.onclick = () => {
        selectedDay[picked] = +el.dataset.day;
        location.replace(`#/${picked}/${el.dataset.day}`);
        render();
      };
    }
  } else {
    renderBestNote(best, now);
    $("cards").innerHTML = renderPhenomenonCards(order, now);
    for (const el of $("cards").querySelectorAll("[data-cell]")) {
      el.onclick = () => {
        const [id, dayMs] = el.dataset.cell.split("|");
        pick(id, now, +dayMs);
      };
    }
  }

  renderRecords(now, inDetail || inRecords);
  if (inRecords) $("recordsBack").onclick = goList;
  // ホームと記録画面の「実際はどうでしたか？」も同じ配線に乗せるため、
  // 描画をすべて終えてから束ねる。
  for (const el of document.querySelector("main").querySelectorAll("[data-outcome]")) {
    el.onclick = () => recordOutcome(el.dataset.pid, +el.dataset.peak, el.dataset.outcome);
  }
  $("footer").innerHTML =
    `${bundle ? S.JstCal.hhmm(bundle.fetchedAt) : "—"} 時点の予測。`
    + `${S.MODELS.length}つの数値予報モデル（${S.MODELS.map((m) => S.MODEL_NAMES[m]).join("・")}）の`
    + `真ん中の値を点数にしています。<br>`
    + (bundle && bundle.ensemble
        ? `点数がどれくらい動きうるかは、ECMWF が初期値をわずかに変えて計算した`
          + `${bundle.ensemble.members.length}通り（アンサンブル予報）の散らばりから出しています。<br>`
        : `${bundle ? "アンサンブル予報が取れなかったため、" : ""}`
          + `点数の確からしさはモデル間の見解の差から出しています。<br>`)
    + `夕焼け・朝焼けは、頭上だけでなく日の入り方向 ${bundle ? Math.round(bundle.sunsetBearing) : "—"}° の空の雲も見ています。<br>`
    + `<strong>これは予測です。</strong>気象庁や ECMWF が出している予報を材料に、`
    + `このアプリが独自に点数を付けたものです。実際の空とは違うことがあります。`
    + `見に行くかどうかの目安としてお使いください。<br>`
    + `予報: Open-Meteo ／ 実況: 気象庁アメダス ／ 光害: <a href="https://djlorenz.github.io/astronomy/lp/">Lorenz Light Pollution Atlas 2025</a>（VIIRS） ／ 検索: OSM Nominatim ・ 国土地理院`;
}

// ---------------------------------------------------------------- 画面の行き来
//
// 一覧（全現象×7日）と詳細（1現象・1日）の2画面。同じページにスクロールで
// 並べていたが、表と詳細が混ざって読みにくかった。
// 場所は URL のハッシュに持つので、ブラウザの戻るがそのまま効く。
//   #             → 一覧
//   #/sunset      → 夕焼けの直近の回
//   #/sunset/1756… → 夕焼けの特定の日
function routeFromHash() {
  if (location.hash === "#/records") return { records: true };
  const m = /^#\/([A-Za-z]+)(?:\/(\d+))?$/.exec(location.hash);
  if (!m || !S.SCORERS[m[1]]) return null;
  return { id: m[1], dayMs: m[2] ? Number(m[2]) : null };
}

/// 詳細へ進む。日を指定しなければ直近の回に合わせる。
function pick(id, now, dayMs) {
  const u = upcoming(weeks[id], now);
  const day = dayMs !== undefined && dayMs !== null ? dayMs : (u ? u.dayMs : null);
  listScrollY = window.scrollY;
  pushedCount++;
  location.hash = day !== null ? `#/${id}/${day}` : `#/${id}`;
}

function goList() {
  // 自分で進めてきたなら戻るで返す（履歴を増やさない）。
  // 詳細のURLを直接開いた場合は戻り先が無いので、ハッシュを外す。
  if (pushedCount > 0) { pushedCount--; history.back(); }
  else location.replace(location.pathname + location.search);
}

function applyRoute() {
  const route = routeFromHash();
  picked = route && route.id ? route.id : null;
  atRecords = !!(route && route.records);
  if (route && route.id) {
    // 日を含まない URL は「直近の回」を指す。前に見ていた日を残すと、
    // #/sunset を開いたのに数日先が出るという食い違いになる。
    if (route.dayMs !== null) selectedDay[route.id] = route.dayMs;
    else delete selectedDay[route.id];
  }
  render();
  // 画面が入れ替わるので位置を戻す。詳細と記録は先頭から、一覧は元いた位置へ。
  if (picked || atRecords) window.scrollTo(0, 0);
  else window.scrollTo(0, listScrollY);
}
window.addEventListener("hashchange", applyRoute);

// 記録へ進む。一覧の位置を覚えておき、戻るで返す。
$("recordsLink").onclick = () => {
  listScrollY = window.scrollY;
  pushedCount++;
  location.hash = "#/records";
};

// いちばんの狙いめ。【押せない】ただの案内にしてある。
//
// 以前はカードごと押すとその現象へ飛んでいたが、見た目が情報カードなので
// 押すつもりのない場所で画面が変わっていた。押せるのは日のボタンだけにする。
function renderBestNote(best, now) {
  if (!best) { $("bestNote").hidden = true; return; }
  const ev = best.u.evaluation, color = RANK_COLOR[ev.rank.key];
  $("bestNote").hidden = false;
  $("bestNote").innerHTML = `<div class="muted" style="font-size:0.72rem">★ ${HIGHLIGHT_HEAD[ev.rank.key]}</div>
    <div style="margin-top:3px"><span style="font-size:1.19rem">${S.PHENOMENA[best.id].icon}</span>
      <strong style="margin-left:4px">${S.PHENOMENA[best.id].name}</strong>
      <span class="muted">${S.JstCal.relativeDay(best.u.dayMs, now)}${ev.specificTime === false ? "" : " " + S.JstCal.hhmmRounded(ev.peak)}</span>
      ・<span style="color:${color};font-weight:700">${esc(S.phrasing(best.id, ev.rank).label)}</span></div>`;
}

// 現象ごとのカード。
//
// 以前は 7現象 × 7日 をひとつの表にしていたが、49個の数字を凡例と
// 照らし合わせて読む形になっていて、「見に行くか」を決める道具になっていなかった。
// 現象ごとに分け、日の良し悪しは【棒の高さ】で示す。
// 色や数字を覚えなくても、どの日がいいかがそのまま見える。
//
// 押せるのは日のボタンだけ。カード全体を押せるようにすると、
// 情報を読んでいるつもりの場所で画面が変わってしまう。
function renderPhenomenonCards(order, now) {
  return order.map((id) => {
    const entries = weeks[id];
    const meta = S.PHENOMENA[id];
    if (!entries || !entries.length) return "";
    const u = upcoming(entries, now);
    const allOut = entries.every((e) => e.evaluation.unavailable);

    if (allOut) {
      // 7日すべて対象外なら、見に行く日が無い。理由だけ書いて、押せる場所も作らない
      //（開いても同じ文が出るだけの行き止まりになる）。
      return `<div class="card">
        <div class="ph-head"><span class="ic">${meta.icon}</span><span class="nm">${meta.name}</span></div>
        <div class="ph-out">${esc(entries[0].evaluation.unavailable.message)}</div></div>`;
    }

    const uev = u ? u.evaluation : null;
    const headRight = uev && !uev.unavailable
      ? `<span class="muted">${S.JstCal.relativeDay(u.dayMs, now)}${uev.specificTime === false ? "" : " " + S.JstCal.hhmmRounded(uev.peak)}</span>
         ・<span style="color:${RANK_COLOR[uev.rank.key]};font-weight:700">${esc(S.phrasing(id, uev.rank).label)}</span>`
      : "";

    const days = entries.map((e) => {
      const ev = e.evaluation;
      const label = S.JstCal.relativeDay(e.dayMs, now).replace(/^(\d+)\/(\d+)\((.)\)$/, "$1/$2<br>$3");
      if (ev.unavailable) {
        return `<div class="day" style="opacity:.45"><span class="v muted">—</span>
          <span class="col"><i style="height:3px;background:var(--line)"></i></span>
          <span class="d">${label}</span></div>`;
      }
      const color = RANK_COLOR[ev.rank.key];
      const h = Math.max(3, Math.round(30 * ev.score / 100));
      const isNext = u && e.dayMs === u.dayMs ? " next" : "";
      // 終わった回は薄くする。押せるままにするのは、見えたかどうかを記録するため。
      const isPast = ev.window[1] <= now ? " past" : "";
      return `<button class="day${isNext}${isPast}" data-cell="${id}|${e.dayMs}"
        title="${esc(meta.name)} ${S.JstCal.relativeDay(e.dayMs, now)} ${Math.round(ev.score)}点 ${esc(S.phrasing(id, ev.rank).label)}${isPast ? "（終了）" : ""}">
        <span class="v" style="color:${color}">${Math.round(ev.score)}</span>
        <span class="col"><i style="height:${h}px;background:${color}"></i></span>
        <span class="d">${label}</span></button>`;
    }).join("");

    return `<div class="card">
      <div class="ph-head"><span class="ic">${meta.icon}</span><span class="nm">${meta.name}</span>${headRight}</div>
      <div class="days">${days}</div></div>`;
  }).join("");
}

// その日の光の時間。写真を撮りに行くなら、点数より先に要る情報。
//
// ゴールデンアワー … 太陽高度 −4°〜+6°。低い日差しで色が乗る
// ブルーアワー     … 太陽高度 −6°〜−4°。空が深い青に沈み、街明かりと釣り合う
// どちらも写真分野の標準的な定義に合わせている。
function renderLightTimes(dayMs, now) {
  const w = S.Sun.lightWindows(dayMs, place.latitude, place.longitude);
  if (w.sunrise === null && w.sunset === null) return "";
  const t = (x) => (x === null ? "—" : S.Cal.hhmmRounded(x));
  const range = (x) => (x === null ? "—" : `${S.Cal.hhmmRounded(x[0])}–${S.Cal.hhmmRounded(x[1])}`);
  return `<div class="card">
    <div class="section-h"><h2>光の時間</h2>
      <span class="tiny">${esc(S.Cal.relativeDay(dayMs, now))}</span></div>
    <div class="lt">
      <span class="lt-h"></span><span class="lt-h">朝</span><span class="lt-h">夕</span>
      <span class="lt-l">ブルーアワー</span><span>${range(w.blueMorning)}</span><span>${range(w.blueEvening)}</span>
      <span class="lt-l">ゴールデンアワー</span><span>${range(w.goldenMorning)}</span><span>${range(w.goldenEvening)}</span>
      <span class="lt-l">日の出・日の入り</span><span>${t(w.sunrise)}</span><span>${t(w.sunset)}</span>
    </div>
    <p class="tiny" style="margin-top:6px">ゴールデンアワーは太陽高度 −4°〜+6°、ブルーアワーは −6°〜−4°。
      日の出前・日の入り後は、空が明るいうちに街明かりと釣り合います。</p>
  </div>`;
}

/// 選択中の現象の詳細。1本の列で、上から読む順に並べる。
///
/// 現象を選ぶプルダウンは置かない。画面を分けたので、別の現象を見たいときは
/// 一覧へ戻って選ぶのが素直で、行き先も分かる。
/// 「週間」はここに残す。この画面で日を替える手段。
function renderDetailPane(id, now) {
  const entries = weeks[id];
  if (!entries || !entries.length) return "";
  const u = upcoming(entries, now);
  const sel = entries.find((e) => e.dayMs === selectedDay[id]) || u;
  const ev = sel.evaluation;
  const meta = S.PHENOMENA[id];
  // 星空は「その瞬間」ではなく「この時間帯に見に行く」話なので、詳細では幅で出す。
  // 一覧のカードは場所が無いので開始時刻だけ。
  const spanHours = (ev.window[1] - ev.window[0]) / 3600000;
  const asRange = id === "starrySky" && spanHours >= 1.5;
  const when = `${S.JstCal.relativeDay(sel.dayMs, now)}`
    + (ev.specificTime === false ? ""
       : asRange ? ` ${S.JstCal.hhmmRounded(ev.window[0])}〜${S.JstCal.hhmmRounded(ev.window[1])}`
       : ` ${S.JstCal.hhmmRounded(ev.peak)}`);

  if (ev.unavailable) {
    return `<div data-id="${id}"><div class="card">
      <div class="ph-head"><span class="ic">${meta.icon}</span><span class="nm">${meta.name}</span></div>
      <div class="ph-out">${esc(ev.unavailable.message)}</div></div>
      <div class="card">${renderWeek(id, entries, sel, now)}</div></div>`;
  }
  const color = RANK_COLOR[ev.rank.key];
  const head = `<div class="card highlight" style="border-color:${color}">
      <div class="ph-head"><span class="ic">${meta.icon}</span><span class="nm">${meta.name}</span></div>
      <div class="head-row">
        <span class="muted">${when}</span>
        ${renderVerdict(id, ev)}
      </div>
      ${renderScoreBar(ev)}
      <div style="margin-top:9px">${esc(S.phrasing(id, ev.rank).say)}</div>
      <div class="tiny" style="margin-top:4px">${CONF_ICON[ev.confidence.key]} ${esc(confidenceText(ev))}</div></div>`;
  return `<div data-id="${id}">${head}
    ${renderLightTimes(sel.dayMs, now)}
    <div class="card">${renderDetail(id, sel, now)}</div>
    <div class="card">${renderWeek(id, entries, sel, now)}</div>
    <details class="card more"><summary>もっと詳しく</summary>
      ${renderDetail(id, sel, now, { part: "how" })}${renderTable(id, entries)}</details>
    <p class="tiny" style="padding:0 4px">📖 ${esc(ev.source)}</p></div>`;
}

// 評価の言葉を主役、点数を従にする。
//
// 点数の実測誤差は ±9.5 点（10地点×61日＝610標本）。ランク境界の間隔は 20〜25 点なので、
// 83% の日はランクが動かない。動かないほうを大きく出す。
// 以前は数字が 38.4px、誤差の但し書きが 11px で、いちばん不確かなものがいちばん大きかった。
function renderVerdict(id, ev) {
  const color = RANK_COLOR[ev.rank.key];
  const raw = ev.uncertainty && ev.uncertainty.expectedError !== null
    ? Math.round(ev.uncertainty.expectedError) : null;
  // 「±0」は点数が正確だという意味に読めるが、そうではない。
  // これは51通りの計算どうしの散らばりで、全通りが一致しても実際の空とはずれる
  // （星空の実測誤差は当日で 12.6点）。上限や 100点の頭打ちに全メンバーが
  // 張り付くと 0 になるので、めずらしくもない。0 のときは何も付けない。
  const err = raw === 0 ? null : raw;
  return `<span class="verdict-box">
    <span class="verdict" style="color:${color}">${esc(S.phrasing(id, ev.rank).label)}</span>
    <span class="big muted">${Math.round(ev.score)}${err !== null ? ` <span style="font-weight:400">±${err}</span>` : ""}</span></span>`;
}

// 点数のバーに、動きうる幅を薄い帯で重ねる。
// 「84」の一点だけを見せると、±8 の幅があることが目に入らない。
function renderScoreBar(ev) {
  const color = RANK_COLOR[ev.rank.key];
  const err = ev.uncertainty && ev.uncertainty.expectedError !== null ? ev.uncertainty.expectedError : null;
  if (err === null) {
    return `<div class="scorebar" style="margin:10px 0 0"><div style="width:${ev.score}%;background:${color}"></div></div>`;
  }
  const lo = Math.max(0, ev.score - err), hi = Math.min(100, ev.score + err);
  return `<div class="scorebar withband" style="margin:10px 0 0">
    <div style="width:${ev.score}%;background:${color}"></div>
    <span class="band" style="left:${lo}%;width:${hi - lo}%;background:${color}"></span></div>`;
}

// 効き具合を記号にする。数字を読まなくても、何が良くて何が足を引っ張っているかが分かる。
//
// 符号だけで決めてはいけない。星空の雲量のように「減点しか無い」要素では、
// 小さな減点はむしろ good な状態を意味する（雲量8%で -4.5 に ✕ を出すと、
// 説明文の「ほとんど雲がありません」と矛盾する）。
// そこで、その評価の中で最も大きな減点・加点を基準にした相対的な重さで決める。
function factorMark(c, maxPositive, maxNegative) {
  if (c < 0) {
    const severity = maxNegative > 0 ? Math.abs(c) / maxNegative : 1;
    if (severity >= 0.6) return { m: "✕", color: "var(--red)" };
    if (severity >= 0.25) return { m: "△", color: "var(--orange)" };
    return { m: "○", color: "var(--accent)" };
  }
  if (c > 0) {
    return c >= maxPositive * 0.6
      ? { m: "◎", color: "var(--accent)" }
      : { m: "○", color: "var(--accent)" };
  }
  return { m: "－", color: "var(--tertiary)" };
}

function renderDetail(id, sel, now, opts = {}) {
  const ev = sel.evaluation;
  const maxAbs = Math.max(1, ...ev.factors.map((f) => Math.abs(f.c)));
  const maxPos = Math.max(0.01, ...ev.factors.map((f) => f.c));
  const maxNeg = Math.max(0.01, ...ev.factors.map((f) => -f.c));
  // 寄与がほぼ 0 の要素は「効かなかった」ことしか言っていない。
  // 1行ずつ並べると、効いた要素が埋もれる。名前だけまとめて1行にする。
  const NEGLIGIBLE = 0.05;
  const moved = ev.factors.filter((f) => Math.abs(f.c) >= NEGLIGIBLE);
  const idle = ev.factors.filter((f) => Math.abs(f.c) < NEGLIGIBLE);
  const factors = moved.map((f) => {
    const pos = f.c >= 0, w = Math.min(50, 50 * Math.abs(f.c) / maxAbs);
    const mk = factorMark(f.c, maxPos, maxNeg);
    return `<div class="f"><div class="fh">
      <span><span class="mark" style="color:${mk.color}">${mk.m}</span>${esc(f.label)}</span>
      <strong style="color:${pos ? "var(--accent)" : "var(--red)"}">${f.c >= 0 ? "+" : ""}${f.c.toFixed(1)}</strong></div>
      <div class="bar"><span class="mid"></span>
        <span class="fill" style="${pos ? `left:50%` : `left:${50 - w}%`};width:${w}%;background:${pos ? "var(--accent)" : "var(--red)"};opacity:.75"></span></div>
      ${f.detail ? `<div class="tiny">${esc(f.detail)}</div>` : ""}</div>`;
  }).join("");
  const perModel = S.MODELS.filter((m) => ev.perModel[m] !== undefined).map((m) => {
    const v = ev.perModel[m], color = RANK_COLOR[S.rankOf(v).key];
    return `<div class="pm"><span class="n">${S.MODEL_NAMES[m]}</span>
      <span class="scorebar"><div style="width:${v}%;background:${color}"></div></span>
      <span class="v">${Math.round(v)}</span></div>`;
  }).join("");
  // 記録できるのはその回が終わってから。まだ来ていない空は評価できない。
  const finished = ev.window[1] <= now;
  const current = findSighting(id, ev.peak);
  const record = finished
    ? `<div style="padding:8px 0"><div style="margin-bottom:6px">実際はどうでしたか？</div>
       ${outcomeButtons(id, ev.peak, current?.outcome ?? null)}</div>`
    : `<p class="tiny" style="padding:4px 0">${S.JstCal.hhmmRounded(ev.peak)} を過ぎたら記録できます</p>`;
  // 広い画面では「なぜこの点数か」と「どれくらい確かか」で列を分ける。
  // 1行を長くしないための分割で、片方だけを描けるように part で切り替える。
  if (opts.part === "how") {
    return `<div style="padding:4px 0 6px">
      ${renderEnsemble(ev)}
      <div class="section-h" style="margin-top:8px"><h2>予報モデルごとの見立て</h2></div>${perModel}
    </div>`;
  }
  return `<div style="padding:4px 0 6px">
    <div class="section-h"><h2>この点数のわけ</h2><span class="tiny">基準 ${Math.round(ev.base)} → ${Math.round(ev.score)}</span></div>
    <div class="factors">${factors}</div>
    ${idle.length ? `<p class="tiny" style="padding:2px 0 0">効かなかった要素: ${
      idle.map((f) => esc(f.label)).join("、")}</p>` : ""}
    ${record}
  </div>`;
}

function renderWeek(id, entries, sel, now) {
  return `<div style="padding:2px 0 6px"><div class="section-h"><h2>週間</h2>
    <span class="tiny">押すとその日に切り替わります</span></div>` + entries.map((e) => {
    const ev = e.evaluation;
    if (ev.unavailable) {
      return `<div class="wk"><span class="d">${S.JstCal.relativeDay(e.dayMs, now)}</span>
        <span class="tiny" style="flex:1">${esc(ev.unavailable.message)}</span></div>`;
    }
    const color = RANK_COLOR[ev.rank.key];
    return `<button class="wk ${e.dayMs === sel.dayMs ? "sel" : ""}" data-day="${e.dayMs}">
      <span class="d">${S.JstCal.relativeDay(e.dayMs, now)}</span>
      <span class="t">${ev.specificTime === false ? "" : S.JstCal.hhmmRounded(ev.peak)}</span>
      <span class="scorebar"><div style="width:${ev.score}%;background:${color}"></div></span>
      <span class="s" style="color:${color}">${Math.round(ev.score)}</span>
      <span class="tiny">${CONF_ICON[ev.confidence.key]}</span></button>`;
  }).join("") + `</div>`;
}

function renderTable(id, entries) {
  if (!bundle) return "";
  const hasSunward = id === "sunset" || id === "sunrise";
  const fmt = (v, unit, dec = 0) => (v === null || v === undefined) ? "—"
    : dec ? v.toFixed(dec) + unit : Math.round(v) + unit;
  const rows = entries.filter((e) => !e.evaluation.unavailable).map((e) => {
    const r = S.readingAt(bundle, id, e.evaluation.peak);
    return `<tr><td>${S.JstCal.relativeDay(e.dayMs, Date.now())}</td>
      <td style="color:${RANK_COLOR[e.evaluation.rank.key]};font-weight:600">${Math.round(e.evaluation.score)}</td>
      <td>${fmt(r.cloudLow, "%")}</td><td>${fmt(r.cloudMid, "%")}</td><td>${fmt(r.cloudHigh, "%")}</td>
      ${hasSunward ? `<td>${fmt(r.sunwardLow, "%")}</td><td>${fmt(r.sunwardMid, "%")}</td><td>${fmt(r.sunwardHigh, "%")}</td>` : ""}
      <td>${fmt(r.precipitation, "", 1)}</td><td>${fmt(r.humidity, "%")}</td>
      <td>${fmt(r.temperature, "℃", 1)}</td>
      <td>${r.visibility === null || r.visibility === undefined ? "—" : Math.round(r.visibility / 1000) + "km"}</td></tr>`;
  }).join("");
  if (!rows) return "";
  return `<div style="padding:4px 0">
    <div class="section-h" style="margin-top:8px"><h2>日ごとの数値</h2></div>
    <div class="scrollx"><table class="numbers">
    <tr><th></th><th>点</th><th>低層</th><th>中層</th><th>高層</th>
    ${hasSunward ? "<th>陽低</th><th>陽中</th><th>陽高</th>" : ""}
    <th>降水</th><th>湿度</th><th>気温</th><th>視程</th></tr>${rows}</table></div>
    <p class="tiny">モデル横断の中央値。「陽側」は太陽方位へ低層165km・中層260km・高層368km離れた地点の雲量。</p></div>`;
}

// ---------------------------------------------------------------- 記録・校正
function findSighting(pid, peak) {
  return sightings.find((s) => s.phenomenon === pid && s.placeName === place.name && S.JstCal.sameDay(s.peak, peak));
}
function recordOutcome(pid, peak, outcome) {
  const entries = weeks[pid] || [];
  const entry = entries.find((e) => Math.abs(e.evaluation.peak - peak) < 60000);
  if (!entry) return;
  const ev = entry.evaluation;
  const existing = findSighting(pid, peak);
  const record = {
    id: existing?.id || crypto.randomUUID(),
    recordedAt: Date.now(), phenomenon: pid, placeName: place.name,
    latitude: place.latitude, longitude: place.longitude,
    peak, score: ev.score, rank: ev.rank.key, confidence: ev.confidence.key,
    perModel: ev.perModel, factors: ev.factors, outcome,
    observations: collectObservations(pid, peak),
  };
  if (existing) sightings = sightings.map((s) => (s.id === existing.id ? record : s));
  else sightings.push(record);
  store.set("sorami.sightings", sightings);
  render();
}
// 生の気象値を残す。閾値を変えたときに過去の記録を再採点できなければ校正のデータにならない。
function collectObservations(pid, peak) {
  if (!bundle) return {};
  const out = {};
  for (const [m, series] of Object.entries(bundle.home.byModel)) {
    for (const v of S.HOME_VARS) {
      if (!series.isSupported(v)) continue;
      const value = series.valueAt(v, peak);
      if (value !== null) out[`${v}@${m}`] = value;
    }
  }
  const offsets = pid === "sunrise" ? bundle.sunriseOffsets : bundle.sunsetOffsets;
  if (offsets) {
    for (const layer of S.CLOUD_LAYERS) {
      const loc = offsets[layer.key];
      if (!loc) continue;
      for (const [m, series] of Object.entries(loc.byModel)) {
        const value = series.valueAt(layer.variable, peak);
        if (value !== null) out[`${layer.variable}@${m}#sunward-${layer.key}`] = value;
      }
    }
  }
  out._grid_elevation = bundle.home.grid.elevation;
  return out;
}
// まだ答えていない、終わった回。
//
// 記録の操作は現象の詳細の中だけにあり、記録カードからは辿れなかった。
// カードに見えるボタンが「書き出し／読み込み」だけだったので、
// それが主要な操作に見えていた（実際そう受け取られた）。
// 答える場所をここに置く。アプリを開いて1タップで済む。
function renderPending(now, hidden) {
  const out = [];
  for (const [id, entries] of Object.entries(weeks)) {
    for (const e of entries) {
      const ev = e.evaluation;
      if (!ev || ev.unavailable) continue;
      if (ev.window[1] > now) continue;                       // まだ終わっていない
      if (now - ev.window[1] > 3 * 86400000) continue;        // 古すぎる回は覚えていない
      if (findSighting(id, ev.peak)) continue;                // もう答えた
      out.push({ id, ev, peak: ev.peak });
    }
  }
  out.sort((a, b) => b.peak - a.peak);
  $("recPending").hidden = hidden || !out.length;
  if (!out.length) { $("recPending").innerHTML = ""; return; }

  // 現象で訊きたいことが違うので、見出しは両方を包める言い方にする。
  $("recPending").innerHTML = `<div class="pending">
    <div style="margin-bottom:6px">実際はどうでしたか？</div>
    ${out.slice(0, 4).map(({ id, ev }) => {
      const meta = S.PHENOMENA[id], color = RANK_COLOR[ev.rank.key];
      return `<div class="pending-row">
        <div><span style="font-size:1.06rem">${meta.icon}</span>
          <strong>${meta.name}</strong>
          <span class="muted">${S.Cal.relativeDay(ev.peak, now)}${ev.specificTime === false ? "" : " " + S.Cal.hhmmRounded(ev.peak)}</span>
          ・<span style="color:${color}">${esc(S.phrasing(id, ev.rank).label)} ${Math.round(ev.score)}</span></div>
        ${outcomeButtons(id, ev.peak, null)}
      </div>`;
    }).join("")}
  </div>`;
}

// 押す場所は1箇所で作る。ホームと詳細で選択肢がずれると、
// 同じ回に別々の答えが入る。
function outcomeButtons(id, peak, current) {
  return `<div class="outcome">${S.outcomesFor(id).map(([k, l]) =>
    `<button data-outcome="${k}" data-pid="${id}" data-peak="${peak}"` +
    `${current === k ? ' class="on"' : ""}>${l}</button>`).join("")}</div>`;
}

function renderRecords(now, pendingHidden) {
  renderPending(now ?? Date.now(), pendingHidden);
  const conclusive = sightings.filter((s) => s.outcome !== "unchecked");
  $("recCount").textContent = `確定 ${conclusive.length}件`;
  // 記録がゼロのうちは、空の帯グラフを毎回出しても読むものがない。
  // 何をすれば貯まるかだけ書く。
  const empty = sightings.length === 0;
  $("recEmpty").hidden = !empty;
  $("recBody").hidden = empty;
  if (empty) return;

  $("calibration").innerHTML =
    qualityCalibration(conclusive.filter((s) => S.recordKind(s.phenomenon) === "quality"))
    + occurrenceCalibration(conclusive.filter((s) => S.recordKind(s.phenomenon) === "occurrence"));

  const LABEL = Object.fromEntries(
    [...S.RECORD_OUTCOMES.quality, ...S.RECORD_OUTCOMES.occurrence]);
  $("recList").innerHTML = `<div class="section-h" style="margin-top:14px"><h2>これまで</h2></div>`
    + ([...sightings].sort((a, b) => b.peak - a.peak).slice(0, 30).map((s) => `
    <div class="list-item" style="display:flex;gap:8px;align-items:center">
      <span>${S.PHENOMENA[s.phenomenon].icon}</span>
      <span style="flex:1"><strong style="font-size:0.81rem">${S.JstCal.monthDay(s.peak)} ${esc(s.placeName)}</strong>
        <div class="tiny">${S.PHENOMENA[s.phenomenon].name} ・ ${Math.round(s.score)}点</div></span>
      <span class="badge" style="background:var(--line)">${LABEL[s.outcome] ?? s.outcome}</span></div>`).join("")
    || `<p class="tiny" style="padding:8px 0">その回が終わると「実際はどうでしたか？」が出ます。</p>`);
}

// 帯は 20点刻み。標本ゼロの帯は 0% ではなく「—」。
// データが無いことと、外れたことを区別する。
const BANDS = [0, 20, 40, 60, 80];
const inBand = (list, lo) => list.filter((s) => s.score >= lo && (s.score < lo + 20 || lo === 80));

// 出るか出ないかの現象。点数どおりの割合で出ていれば較正できている。
// 棒は単色。隣の質のグラフでは色が答えを表すので、同じ画面で色に2つの意味を持たせない。
function occurrenceCalibration(list) {
  if (!list.length) return "";
  const rows = BANDS.map((lo) => {
    const bin = inBand(list, lo), seen = bin.filter((s) => s.outcome === "seen").length;
    const rate = bin.length ? seen / bin.length : null, predicted = lo + 10;
    return `<div class="bin"><span class="lb">${lo}–${lo + 20}</span>
      <span class="bar">${rate !== null ? `<span class="fill" style="width:${rate * 100}%;background:var(--good)"></span>` : ""}
        <span class="mark" style="left:${predicted}%"></span></span>
      <span class="pv">${rate !== null ? Math.round(rate * 100) + "%" : "—"}</span>
      <span class="tiny" style="width:20px;text-align:right">${bin.length}</span></div>`;
  }).join("");
  return `<div class="section-h" style="margin-top:4px"><h2>出たかどうか</h2>
      <span class="muted">${list.length}件</span></div>
    <p class="tiny" style="margin:-2px 0 6px">雲海・霧氷・ダイヤモンドダスト・虹</p>
    <div class="bins">${rows}</div>
    <p class="tiny" style="margin-top:6px">横棒が実際に見えた割合、縦線が点数どおりならこうなるはずという水準です。棒が線より短ければ点数が甘く、長ければ辛いということ。</p>`;
}

// 質の現象。「見えたか」では何点でもほぼ100%になるので、
// 期待に対してどうだったかの内訳を見る。
function qualityCalibration(list) {
  if (!list.length) return "";
  const SEG = [["worse", "期待外れ", "var(--tertiary)"],
               ["asExpected", "想定どおり", "var(--good)"],
               ["better", "期待以上", "var(--spectacular)"]];
  const rows = BANDS.map((lo) => {
    const bin = inBand(list, lo);
    const seg = bin.length ? SEG.map(([k, , color]) => {
      const n = bin.filter((s) => s.outcome === k).length;
      return n ? `<span class="seg" style="width:${n / bin.length * 100}%;background:${color}"></span>` : "";
    }).join("") : "";
    return `<div class="bin"><span class="lb">${lo}–${lo + 20}</span>
      <span class="bar">${seg}</span>
      <span class="pv">${bin.length ? "" : "—"}</span>
      <span class="tiny" style="width:20px;text-align:right">${bin.length}</span></div>`;
  }).join("");
  return `<div class="section-h" style="margin-top:4px"><h2>点数どおりだったか</h2>
      <span class="muted">${list.length}件</span></div>
    <p class="tiny" style="margin:-2px 0 6px">朝焼け・夕焼け・星空</p>
    <div class="bins">${rows}</div>
    <p class="tiny" style="margin-top:6px">
      <span style="color:var(--good)">■</span> 想定どおり が多く、
      <span style="color:var(--tertiary)">■</span> 期待外れ と
      <span style="color:var(--spectacular)">■</span> 期待以上 が釣り合っていれば点数は合っています。
      期待外れ側に偏っていれば点数が甘く、期待以上側に偏っていれば辛いということ。</p>`;
}

// ---------------------------------------------------------------- 地点
function selectPlace(p) {
  place = p;
  store.set("sorami.place", p);
  $("placeSheet").close();
  selectedDay = {};
  load(true);
}
function renderSheet() {
  $("favList").innerHTML = favorites.length
    ? favorites.map((f, i) => `<div style="display:flex;align-items:center">
        <button class="list-item" style="flex:1" data-fav="${i}"><strong>${esc(f.name)}</strong>
          <div class="tiny">${esc(f.subtitle || "")}</div></button>
        <button data-unfav="${i}" style="padding:8px;color:var(--tertiary)">✕</button></div>`).join("")
    : `<span class="tiny">よく使う地点は選択後、地点名の横の ☆ で登録できます</span>`;
  for (const el of $("favList").querySelectorAll("[data-fav]")) el.onclick = () => selectPlace(favorites[+el.dataset.fav]);
  for (const el of $("favList").querySelectorAll("[data-unfav]")) el.onclick = () => {
    favorites.splice(+el.dataset.unfav, 1); store.set("sorami.favorites", favorites); renderSheet();
  };

  const filter = window._spotFilter || null;
  // 並びは一覧のカードと揃える。spots.js に出てきた順のままだと、
  // 画面ごとに現象の順序が違って探しにくい。
  const phenomenaWithSpots = [...new Set(SORAMI_SPOTS.spots.flatMap((s) => s.phenomena))]
    .sort((a, b) => S.PHENOMENA[a].order - S.PHENOMENA[b].order);
  $("spotChips").innerHTML = `<button class="${!filter ? "on" : ""}" data-chip="">すべて</button>`
    + phenomenaWithSpots.map((p) => `<button class="${filter === p ? "on" : ""}" data-chip="${p}">${S.PHENOMENA[p].name}</button>`).join("");
  for (const el of $("spotChips").querySelectorAll("[data-chip]")) {
    el.onclick = () => { window._spotFilter = el.dataset.chip || null; renderSheet(); };
  }
  // 33件を素のまま並べると、何を探せばいいのか分からない。現象で束ねる。
  //
  // スポットは複数の現象を持つ（陸別はダイヤモンドダストと星空）。
  // 全部の見出しに出すと同じ地点が何度も現れて数が合わなくなるので、
  // **先頭の現象を主カテゴリとして1回だけ出す**。
  // 副次的な用途はアイコンで分かるし、チップで絞れば拾える。
  const renderSpot = (s) => `<button class="list-item" data-spot="${s.id}">
      <strong>${esc(s.name)}</strong> <span class="tiny">${s.phenomena.map((p) => S.PHENOMENA[p].icon).join("")}</span>
      <div class="tiny">${esc(s.prefecture)} ・ 標高${Math.round(s.elevation)}m ー ${esc(s.note)}</div></button>`;
  // 同じカテゴリの中は北から南へ。ファイルに書いた順は意味を持たない。
  const northToSouth = (a, b) => b.latitude - a.latitude;
  if (filter) {
    // 絞り込み中は見出しが冗長。副次的な用途で該当するものも拾う。
    $("spotList").innerHTML = SORAMI_SPOTS.spots
      .filter((s) => s.phenomena.includes(filter)).sort(northToSouth).map(renderSpot).join("");
  } else {
    $("spotList").innerHTML = phenomenaWithSpots.map((p) => {
      const list = SORAMI_SPOTS.spots.filter((s) => s.phenomena[0] === p).sort(northToSouth);
      if (!list.length) return "";
      return `<div class="spot-cat">${S.PHENOMENA[p].icon} ${S.PHENOMENA[p].name}`
        + `<span class="tiny">${list.length}件</span></div>${list.map(renderSpot).join("")}`;
    }).join("");
  }
  for (const el of $("spotList").querySelectorAll("[data-spot]")) {
    el.onclick = () => {
      const s = SORAMI_SPOTS.spots.find((x) => x.id === el.dataset.spot);
      selectPlace({ id: "spot:" + s.id, name: s.name, subtitle: s.prefecture,
        latitude: s.latitude, longitude: s.longitude, terrain: s.terrain, elevation: s.elevation });
    };
  }
}
$("placeButton").onclick = () => { renderSheet(); $("placeSheet").showModal(); };
$("placeClose").onclick = () => $("placeSheet").close();
$("geoButton").onclick = () => {
  $("geoStatus").textContent = "";
  navigator.geolocation.getCurrentPosition(
    (pos) => selectPlace({ id: "current", name: "現在地", subtitle: "",
      latitude: pos.coords.latitude, longitude: pos.coords.longitude, terrain: null, elevation: null }),
    () => { $("geoStatus").textContent = "現在地を取得できませんでした（HTTPS でのみ利用できます）"; },
    { timeout: 10000 });
};
$("searchBox").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  const q = $("searchBox").value.trim();
  if (!q) return;
  $("searchResults").innerHTML = `<p class="tiny">検索中…</p>`;
  try {
    const url = "https://nominatim.openstreetmap.org/search?" + new URLSearchParams(
      { q, format: "jsonv2", limit: "6", countrycodes: "jp", "accept-language": "ja" });
    const results = await (await fetch(url)).json();
    $("searchResults").innerHTML = results.length
      ? results.map((r, i) => `<button class="list-item" data-sr="${i}"><strong>${esc(r.name || r.display_name.split(",")[0])}</strong>
          <div class="tiny">${esc(r.display_name)}</div></button>`).join("")
      : `<p class="tiny">該当なし</p>`;
    for (const el of $("searchResults").querySelectorAll("[data-sr]")) {
      el.onclick = () => {
        const r = results[+el.dataset.sr];
        selectPlace({ id: `search:${r.lat},${r.lon}`, name: r.name || r.display_name.split(",")[0],
          subtitle: r.display_name.split(",").slice(1, 3).join("").trim(),
          latitude: +r.lat, longitude: +r.lon, terrain: null, elevation: null });
      };
    }
  } catch { $("searchResults").innerHTML = `<p class="warn">検索に失敗しました</p>`; }
});

// 選択中の地点をお気に入りへ（地点名タップ長押し代わりに ☆ を出す）
$("placeName").insertAdjacentHTML("afterend",
  ` <button id="favToggle" class="tap" style="font-size:1rem;vertical-align:2px"></button>`);
function renderFavToggle() {
  const isFav = favorites.some((f) => f.id === place.id);
  $("favToggle").textContent = isFav ? "★" : "☆";
  $("favToggle").style.color = isFav ? "var(--accent)" : "var(--tertiary)";
}
$("favToggle").onclick = (e) => {
  e.stopPropagation();
  const i = favorites.findIndex((f) => f.id === place.id);
  if (i >= 0) favorites.splice(i, 1); else favorites.push(place);
  store.set("sorami.favorites", favorites);
  renderFavToggle();
};
new MutationObserver(renderFavToggle).observe($("placeName"), { childList: true });

// 記録は localStorage にあり、ブラウザのデータ消去で消える。
// 校正のために貯めるものなので、書き出して残せるようにしておく。
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), sightings }, null, 1)],
    { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `sorami-sightings-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const incoming = Array.isArray(data) ? data : data.sightings;
    if (!Array.isArray(incoming)) throw new Error("形式が違います");
    // 同じ id は上書き、無いものは追加。取り込みで既存の記録を失わせない。
    const byId = new Map(sightings.map((s) => [s.id, s]));
    for (const rec of incoming) if (rec && rec.id) byId.set(rec.id, rec);
    sightings = [...byId.values()];
    store.set("sorami.sightings", sightings);
    render();   // 押下の配線と画面の出し分けごとやり直す
    alert(`${incoming.length}件を読み込みました（合計 ${sightings.length}件）`);
  } catch (err) {
    alert("読み込めませんでした: " + err.message);
  }
  e.target.value = "";
};

// 幅が閾値をまたいだら描画し直す（ウィンドウのリサイズ・画面回転）
WIDE.addEventListener("change", () => { if (bundle) render(); });

// GitHub Pages は HTML に max-age=600 を付けるため、更新しても最大10分は
// 古い index.html が使われる。JS 側にキャッシュバスターを付けていても、
// その版番号を書いている HTML 自体が古いので効かない（実際に旧画面が出た）。
//
// 読み込み後に本物の HTML を取りに行き、版が違えば一度だけ読み直す。
// 一度きりにするのは、取得に失敗し続けたときの再読み込みループを避けるため。
async function checkForUpdate() {
  const running = (document.querySelector('script[src*="sorami-core.js"]') || {}).src || "";
  const mine = (running.match(/[?&]v=(\d+)/) || [])[1];
  if (!mine || sessionStorage.getItem("sorami.reloaded") === mine) return;
  try {
    const html = await (await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" })).text();
    const latest = (html.match(/sorami-core\.js\?v=(\d+)/) || [])[1];
    if (latest && latest !== mine) {
      sessionStorage.setItem("sorami.reloaded", latest);
      location.reload();
    }
  } catch { /* 取れなければそのまま使う。更新確認は補助 */ }
}

load(false);
checkForUpdate();
</script>
